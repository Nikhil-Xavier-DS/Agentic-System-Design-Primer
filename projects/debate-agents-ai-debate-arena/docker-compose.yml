services:
  app:
    build:
      context: ../..
      dockerfile: projects/${debate-agents-ai-debate-arena_DIR:-debate-agents-ai-debate-arena}/Dockerfile
    environment:
      MODEL_PROVIDER: ${MODEL_PROVIDER:-ollama}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes:
      - ollama:/root/.ollama
volumes:
  ollama:
