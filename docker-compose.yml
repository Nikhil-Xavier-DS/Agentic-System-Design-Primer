services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: agent
      POSTGRES_USER: agent
      POSTGRES_DB: agents
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/agentpassword
    ports: ["7474:7474", "7687:7687"]
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:latest
    ports: ["3000:3000"]
